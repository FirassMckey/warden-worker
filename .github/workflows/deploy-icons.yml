name: Deploy Warden Icons Worker

on:
  push:
    branches:
      - warden-icons # Change this if your branch has a different name
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Prepare wrangler.toml (KV Namespace & ALLOWED_ORIGIN)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
        run: |
          set -e

          if [ -z "$ALLOWED_ORIGIN" ]; then
            echo "Error: ALLOWED_ORIGIN secret is missing or empty."
            exit 1
          fi

          # Replace generic ALLOWED_ORIGIN in wrangler.toml with the secret value (for this build only)
          node -e '
            const fs = require("fs");
            let content = fs.readFileSync("wrangler.toml", "utf8");
            content = content.replace(
              /ALLOWED_ORIGIN\s*=\s*"[^"]*"/,
              `ALLOWED_ORIGIN = "${process.env.ALLOWED_ORIGIN}"`
            );
            fs.writeFileSync("wrangler.toml", content, "utf8");
          '

          KV_TITLE="warden-icons-cache"

          # Check if KV namespace already exists
          KV_ID=$(wrangler kv namespace list | node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(0, "utf-8"));
            const ns = data.find(n => n.title === "'"$KV_TITLE"'");
            if (ns) console.log(ns.id);
          ')

          # Create KV namespace if it does not exist yet
          if [ -z "$KV_ID" ]; then
            echo "Creating new KV namespace: $KV_TITLE"
            CREATE_OUT=$(wrangler kv namespace create "$KV_TITLE")
            KV_ID=$(echo "$CREATE_OUT" | grep -oE "[a-f0-9]{32}" | head -n 1)
          else
            echo "Found existing KV namespace ID: $KV_ID"
          fi

          if [ -z "$KV_ID" ]; then
            echo "Error: Failed to retrieve or create KV namespace ID."
            exit 1
          fi

          # Inject the real KV ID into wrangler.toml (for this build only)
          sed -i "s/REPLACE_WITH_KV_ID/$KV_ID/g" wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}